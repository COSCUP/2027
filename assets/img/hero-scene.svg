<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760"
     role="img" aria-label="COSCUP 2027 key visual: an illustrated island floating on a summer sea">
  <title>COSCUP 2027 illustrated summer scene</title>

  <!-- ======================================================================
       Palette mirrors the COSCUP 2026 key visual. Keep edits inside <defs>
       so the whole scene can be re-tinted from one place.
       ====================================================================== -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#57a6e6"/>
      <stop offset="0.45" stop-color="#2b7fd0"/>
      <stop offset="1"   stop-color="#00589a"/>
    </linearGradient>

    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a2e403"/>
      <stop offset="1" stop-color="#4f9c24"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e6e3"/>
    </linearGradient>

    <g id="sparkle">
      <path d="M0 -26 C 3 -8, 8 -3, 26 0 C 8 3, 3 8, 0 26 C -3 8, -8 3, -26 0 C -8 -3, -3 -8, 0 -26 Z"/>
    </g>

    <g id="cloud">
      <path d="M0 0 c0-26 21-47 47-47 8 0 16 2 22 6 12-22 35-37 62-37 36 0 66 26 70 60 4-2 9-3 14-3 20 0 36 16 36 36 0 20-16 36-36 36H36C16 51 0 35 0 15Z"/>
    </g>
  </defs>

  <!-- ======================= sky layer: clouds ============================ -->
  <g class="scene-clouds" opacity=".95">
    <use href="#cloud" x="70"   y="118" fill="#ffffff" transform="scale(1.15)" opacity=".9"/>
    <use href="#cloud" x="880"  y="52"  fill="#ffffff" transform="scale(1.35)" opacity=".82"/>
    <use href="#cloud" x="430"  y="30"  fill="#e9f4ff" transform="scale(.85)"  opacity=".8"/>
    <use href="#cloud" x="1180" y="150" fill="#ffffff" transform="scale(.95)"  opacity=".85"/>
  </g>

  <!-- ======================= decorative doodles =========================== -->
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M120 250 c40-34 78 10 42 40 -30 25-70-6-46-40" stroke="#ff7ab5"/>
    <path d="M1400 210 c46-30 84 16 46 44 -32 24-72-8-48-42" stroke="#39d7d0"/>
    <path d="M300 96 c34 24 66-6 92 22" stroke="#39d7d0" stroke-width="6"/>
    <path d="M1240 300 c30-26 62 4 90-18" stroke="#ff7ab5" stroke-width="6"/>
  </g>

  <g fill="#a2e403">
    <ellipse cx="215" cy="196" rx="26" ry="10" transform="rotate(-18 215 196)"/>
    <ellipse cx="1352" cy="132" rx="24" ry="9" transform="rotate(14 1352 132)"/>
    <ellipse cx="700" cy="212" rx="20" ry="8" transform="rotate(-8 700 212)"/>
  </g>

  <g fill="#ff7ab5">
    <ellipse cx="1102" cy="248" rx="22" ry="9" transform="rotate(-12 1102 248)"/>
    <ellipse cx="392" cy="228" rx="18" ry="7" transform="rotate(16 392 228)"/>
  </g>

  <g fill="#ffd23f">
    <use href="#sparkle" transform="translate(268 300) scale(.85)"/>
    <use href="#sparkle" transform="translate(1330 386) scale(1.05)"/>
    <use href="#sparkle" transform="translate(560 168) scale(.6)"/>
  </g>

  <g fill="#ffffff">
    <use href="#sparkle" transform="translate(1024 190) scale(.55)"/>
    <use href="#sparkle" transform="translate(160 372) scale(.7)"/>
    <use href="#sparkle" transform="translate(1468 306) scale(.5)"/>
  </g>

  <!-- ============================== sea =================================== -->
  <path d="M0 352 C 260 322, 420 372, 700 350 C 980 328, 1180 372, 1600 340 L1600 760 L0 760 Z"
        fill="url(#sea)"/>
  <path d="M0 352 C 260 322, 420 372, 700 350 C 980 328, 1180 372, 1600 340"
        fill="none" stroke="#000204" stroke-width="5"/>

  <!-- sea sparkle strokes -->
  <g fill="none" stroke="#bfe4ff" stroke-linecap="round" stroke-width="6" opacity=".75">
    <path d="M110 470 c30-14 60 14 90 0"/>
    <path d="M1300 500 c32-15 64 15 96 0"/>
    <path d="M400 660 c34-16 68 16 102 0"/>
    <path d="M960 690 c30-14 60 14 90 0"/>
    <path d="M640 588 c26-12 52 12 78 0"/>
    <path d="M1160 632 c26-12 52 12 78 0"/>
  </g>

  <!-- ============================= island ================================= -->
  <g class="scene-island" transform="translate(806 500) scale(1.14) translate(-806 -500)">
    <!-- landmass -->
    <path d="M540 520 C 556 468, 640 442, 722 439 C 802 436, 858 416, 932 422
             C 1002 428, 1062 458, 1080 500 C 1094 532, 1046 552, 986 557
             C 896 564, 796 566, 696 563 C 616 560, 540 552, 540 520 Z"
          fill="url(#island)" stroke="#000204" stroke-width="6" stroke-linejoin="round"/>

    <!-- hills -->
    <path d="M690 470 c22-42 62-44 84-4 -28 12-56 14-84 4Z" fill="#4f9c24"/>
    <path d="M790 462 c26-52 74-52 100-2 -34 14-68 16-100 2Z" fill="#3f8b1c"/>
    <path d="M900 468 c20-36 56-38 76-4 -26 12-52 14-76 4Z" fill="#4f9c24"/>

    <!-- shoreline highlight -->
    <path d="M566 530 c120 24 420 28 500 8" fill="none" stroke="#d7ff7a"
          stroke-width="5" stroke-linecap="round" opacity=".7"/>

    <!-- beach umbrella, left — striped parasol -->
    <g transform="translate(624 446)">
      <path d="M0 0 v86" stroke="#000204" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 0 L-64 0 A64 44 0 0 1 -45.3 -31.1 Z" fill="#ff685b"/>
      <path d="M0 0 L-45.3 -31.1 A64 44 0 0 1 0 -44 Z" fill="#6969d6"/>
      <path d="M0 0 L0 -44 A64 44 0 0 1 45.3 -31.1 Z" fill="#ff685b"/>
      <path d="M0 0 L45.3 -31.1 A64 44 0 0 1 64 0 Z" fill="#6969d6"/>
      <path d="M-64 0 A64 44 0 0 1 64 0 Z" fill="none" stroke="#000204"
            stroke-width="6" stroke-linejoin="round"/>
      <path d="M-45.3 -31.1 L0 0 M0 -44 L0 0 M45.3 -31.1 L0 0"
            stroke="#000204" stroke-width="3.5" opacity=".8"/>
    </g>

    <!-- beach umbrella, right — striped parasol -->
    <g transform="translate(1006 452)">
      <path d="M0 0 v78" stroke="#000204" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 0 L-54 0 A54 38 0 0 1 -38.2 -26.9 Z" fill="#39d7d0"/>
      <path d="M0 0 L-38.2 -26.9 A54 38 0 0 1 0 -38 Z" fill="#ffd23f"/>
      <path d="M0 0 L0 -38 A54 38 0 0 1 38.2 -26.9 Z" fill="#39d7d0"/>
      <path d="M0 0 L38.2 -26.9 A54 38 0 0 1 54 0 Z" fill="#ffd23f"/>
      <path d="M-54 0 A54 38 0 0 1 54 0 Z" fill="none" stroke="#000204"
            stroke-width="6" stroke-linejoin="round"/>
      <path d="M-38.2 -26.9 L0 0 M0 -38 L0 0 M38.2 -26.9 L0 0"
            stroke="#000204" stroke-width="3.5" opacity=".8"/>
    </g>

    <!-- grass tufts -->
    <g fill="none" stroke="#2f7a12" stroke-width="4" stroke-linecap="round">
      <path d="M700 548 v-16 M708 548 c-2-10 2-14 6-18 M692 548 c2-10-2-14-6-18"/>
      <path d="M950 546 v-14 M958 546 c-2-9 2-13 6-16 M942 546 c2-9-2-13-6-16"/>
    </g>

    <!-- little food-stall sign, a nod to the 2026 night-market scene -->
    <g transform="translate(852 470)">
      <path d="M0 0 v52" stroke="#000204" stroke-width="5" stroke-linecap="round"/>
      <rect x="-34" y="-26" width="68" height="30" rx="6"
            fill="#ffd23f" stroke="#000204" stroke-width="5"/>
      <path d="M-22 -16 h20 M-22 -6 h34" stroke="#000204" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ====================== swim ring, left (bear) ======================== -->
  <g transform="translate(232 566) rotate(-6)">
    <ellipse cx="0" cy="26" rx="104" ry="26" fill="#00457c" opacity=".35"/>
    <circle r="86" fill="url(#ring)" stroke="#000204" stroke-width="7"/>
    <path d="M-86 0 a86 86 0 0 1 86-86 v86 Z" fill="#ff685b"/>
    <path d="M86 0 a86 86 0 0 1-86 86 v-86 Z" fill="#ffd23f"/>
    <circle r="86" fill="none" stroke="#000204" stroke-width="7"/>
    <circle r="40" fill="#2b7fd0" stroke="#000204" stroke-width="6"/>

    <g transform="translate(0 -6)">
      <circle cx="-26" cy="-24" r="13" fill="#c0662f" stroke="#000204" stroke-width="5"/>
      <circle cx="26"  cy="-24" r="13" fill="#c0662f" stroke="#000204" stroke-width="5"/>
      <circle r="32" fill="#c0662f" stroke="#000204" stroke-width="6"/>
      <ellipse cy="10" rx="17" ry="13" fill="#f3d3ac"/>
      <circle cx="-12" cy="-4" r="4" fill="#000204"/>
      <circle cx="12"  cy="-4" r="4" fill="#000204"/>
      <path d="M-6 8 q6 6 12 0" fill="none" stroke="#000204" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ====================== swim ring, right (bird) ======================= -->
  <g transform="translate(1362 596) rotate(7)">
    <ellipse cx="0" cy="24" rx="94" ry="24" fill="#00457c" opacity=".35"/>
    <circle r="78" fill="url(#ring)" stroke="#000204" stroke-width="7"/>
    <path d="M-78 0 a78 78 0 0 1 78-78 v78 Z" fill="#6969d6"/>
    <path d="M78 0 a78 78 0 0 1-78 78 v-78 Z" fill="#39d7d0"/>
    <circle r="78" fill="none" stroke="#000204" stroke-width="7"/>
    <circle r="36" fill="#2b7fd0" stroke="#000204" stroke-width="6"/>

    <g transform="translate(-4 -6)">
      <!-- comb -->
      <path d="M-16 -30 q8-16 16-4 q8-14 16 2 q6-10 10 4" fill="none"
            stroke="#e2402f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="30" fill="#ff685b" stroke="#000204" stroke-width="6"/>
      <!-- beak, clear of the head outline -->
      <path d="M27 -2 L54 6 L27 15 Z" fill="#ffd23f" stroke="#000204"
            stroke-width="5" stroke-linejoin="round"/>
      <circle cx="10" cy="-8" r="5" fill="#000204"/>
      <circle cx="11.5" cy="-9.5" r="1.7" fill="#ffffff"/>
      <circle cx="-12" cy="-6" r="4" fill="#000204"/>
      <ellipse cx="-16" cy="8" rx="7" ry="4.5" fill="#ff9a8f" opacity=".85"/>
    </g>
  </g>

  <!-- ============================ foam lip ================================ -->
  <g fill="#ffffff" opacity=".5">
    <ellipse cx="352" cy="612" rx="46" ry="9"/>
    <ellipse cx="1180" cy="546" rx="38" ry="8"/>
    <ellipse cx="760" cy="700" rx="54" ry="10"/>
  </g>
</svg>
